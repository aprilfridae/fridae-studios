[package]
name = "fridae"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fridae"
path = "src/main.rs"

[profile.release]
opt-level = 2
strip = true

[dependencies]
arboard = "3.7.0"
getrandom = "0.4.3"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif", "ico", "tga", "tiff"] }
native-tls = "0.2.18"
open = "5.4.5"
regex = "1.13.1"
rfd = { version = "0.18.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "json"] }
wry = "0.57.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# remote control: the host's certificate with its private key kept by Windows, and TLS (remote_host.rs); DPAPI keeps
# the tokens for paired computers, and the adapter list gives each network's broadcast address (remote_client.rs)
schannel = "0.1.30"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }


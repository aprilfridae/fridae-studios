[package]
name = "fridae"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fridae"
path = "src/main.rs"

[profile.release]
opt-level = 2
strip = true

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif", "ico", "tga", "tiff"] }
open = "5.4.5"
regex = "1.13.1"
rfd = { version = "0.18.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "json"] }
wry = "0.57.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridae</title>
<style>
@font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url("/fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }

/* One greyscale palette, one outline per surface, one radius scale.
   Spacing: 4 8 12 16 24 32 48 (2 only inside a control). Controls: 28 small, 32 regular, 40 for a page's main field.
   Type: 12 13 14 15 16 20; 20/600 is a Settings section's title, 16/600 a page or a card, 14/600 a part of one.
   Buttons: .pill.main is the one main action of a place (white), .pill the rest, .linkish a quiet word in a line;
   .sm (28px) only in a list's row or beside a heading, never for a section's own action.
   Motion: --t-fast for hover and press, --t-mid for a control changing state, --t-slow for a panel or a page
   arriving; always --ease (a fast start, a soft landing), only opacity and transform, never a bounce. Less motion
   (the system setting) turns it all off at the bottom of this sheet.
   Every size is in px and the whole page is scaled with the text-size setting (Ctrl + and Ctrl -), so nothing needs
   its own size rules. */
:root {
  --bg: #0b0b0c;
  --panel: #111112;
  --raised: #18181a;
  --hover: rgba(255, 255, 255, 0.05);
  --press: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.15);
  --text: #ececed;
  --dim: #a0a0a4;
  --faint: #8b8b90;   /* muted text: 5.8:1 on --bg, 5.2:1 on --raised; never on a pressed or selected row (use --dim) */
  --quiet: #6a6a6e;   /* marks that are not text: hollow dots, step markers, an off switch */
  --ink: #0b0b0c;
  --main: var(--text);        /* the one main action of a place, and the send button */
  --main-ink: var(--ink);
  --main-hover: #fff;
  --accent: var(--text);      /* a chosen thing's ring, a switch that is on */
  --card: #111112;            /* a settings group's surface */
  --shadow-pop: 0 20px 60px rgba(0, 0, 0, 0.6);
  --shadow-dialog: 0 30px 90px rgba(0, 0, 0, 0.6);
  /* glass: a surface that lets what scrolls behind it show through, blurred (menus, the message box, panels) */
  --glass-blur: 16px; --glass-opacity: 80%; --glass-saturation: 1.08;
  /* T3 Code's further colour roles, here in Fridae's own dark (each theme sets its own: themeVars) */
  --side-bg: var(--panel); --side-ink: var(--text); --side-dim: var(--dim); --side-line: var(--line);
  --side-hover: var(--hover); --side-on: var(--press);
  --msg-bg: var(--raised); --msg-ink: var(--text); --code-bg: var(--panel); --ctl-hover: rgba(255, 255, 255, 0.08);
  --muted-bg: rgba(255, 255, 255, 0.03); --icon: var(--faint); --placeholder: var(--faint);
  --bad-ink: #ff6467; --bad-bg: #2a1213; --warn-ink: #ffb900; --warn-bg: #2a1f0c;
  --warn: #e5a23c;    /* the one colour: something is missing or nearly used up */
  --bad: #e5484d;     /* only a step that failed (Settings, Knowledge index), beside its plain-words line */
  --r-s: 8px; --r-m: 12px; --r-l: 16px;
  --h-s: 28px; --h-m: 32px; --h-l: 40px;
  --focus: rgba(255, 255, 255, 0.6);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --t-fast: 120ms; --t-mid: 160ms; --t-slow: 220ms;
  --sans: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Geist Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; overflow-wrap: break-word; font-feature-settings: "ss01", "cv11"; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--text) 22%, transparent); }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; margin-block: var(--r-l); } /* stops short of rounded corners */
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 10%, transparent); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text) 20%, transparent); background-clip: content-box; }
::-webkit-scrollbar-button { display: none; }
.enter { animation: rise 280ms var(--ease) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
/* a page or a Settings section shown again plays this once (display: none to shown restarts it); only the inside
   moves, so nothing fixed inside a scrolling page is caught by a transform */
#review > .rv-page, #promos > .r-col, #newproj > .r-col, .su-body > section.on > .st-page { animation: arrive var(--t-slow) var(--ease) backwards; }
.body > .main, .scroll > .col { animation: fade var(--t-mid) ease backwards; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--text) 40%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
/* small motion that says what changed: what a fold opens rises into place; a bar fills from its start; a pressed
   square button gives a little; a picture shown large grows out of the dark. All of it is opacity and transform,
   and less motion (the system setting) turns it off with the rest at the bottom of this sheet. */
.moreinfo[open] > :not(summary), .pr-more[open] > :not(summary), .cv-gone[open] > :not(summary), .o-key[open] > p, .steps.done.open .step { animation: arrive var(--t-mid) var(--ease) backwards; }
@keyframes grow-x { from { transform: scaleX(0); } }
.lw-fill { transform-origin: left center; animation: grow-x 520ms var(--ease) backwards; }
.icon { transition: background-color 140ms ease, color 140ms ease, transform var(--t-fast) var(--ease); }
.icon:active { transform: scale(0.94); }
.chip:active { background: var(--press); }
.light img { transform: scale(0.97); transition: transform var(--t-slow) var(--ease); }
.light.on img { transform: none; }

/* ---------- shared controls ---------- */
.pill { height: var(--h-m); padding: 0 16px; border-radius: 999px; font-size: 13px; background: var(--hover); border: 1px solid var(--line); white-space: nowrap; transition: background-color var(--t-fast) ease, border-color var(--t-fast) ease, transform var(--t-fast) var(--ease), opacity var(--t-mid) ease; }
.pill:hover { background: var(--press); border-color: var(--line-strong); }
.pill:active { transform: scale(0.97); }
.pill:disabled { opacity: 0.45; transform: none; }
.pill:disabled:hover { background: var(--hover); border-color: var(--line); }
.pill.main:disabled:hover { background: var(--main); }
.pill.sm { height: var(--h-s); padding: 0 12px; font-size: 12px; }
/* display: the layout rule `.main` (a grid) also matches these buttons and would push the label to the top */
.pill.main { display: inline-block; background: var(--main); color: var(--main-ink); border-color: transparent; font-weight: 500; }
.pill.main:hover { background: var(--main-hover); }
.pill.on { background: color-mix(in srgb, var(--text) 16%, transparent); border-color: var(--line-strong); }
.icon { width: var(--h-m); height: var(--h-m); border-radius: var(--r-s); display: grid; place-items: center; color: var(--dim); transition: background-color 140ms ease, color 140ms ease; }
.icon:hover, .icon[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.icon:active { background: var(--press); }
.linkish { color: var(--text); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--text) 35%, transparent); text-underline-offset: 3px; font-size: 13px; border-radius: 4px; transition: text-decoration-color var(--t-fast) ease, color var(--t-fast) ease; }
.linkish:hover { text-decoration-color: currentColor; }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 4px; }
.sub { font-size: 13px; color: var(--dim); line-height: 1.5; margin: 4px 0 0; }
.grow { flex: 1; min-width: 0; }
.keyrow { display: flex; gap: 8px; margin: 12px 0 4px; }
.keyrow input, .field { flex: 1; min-width: 0; height: var(--h-m); padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--raised); font-size: 13px; outline: none; -webkit-user-select: text; user-select: text; }
.keyrow input:focus, .field:focus { border-color: var(--focus); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); padding: 4px 0; text-align: left; transition: color 140ms ease; }
.switch:hover { color: var(--text); }
.switch .track { flex: none; width: 28px; height: 16px; border-radius: 999px; background: var(--press); border: 1px solid var(--line-strong); position: relative; transition: background-color 160ms ease; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--quiet); transition: transform 160ms var(--ease), background-color 160ms ease; }
.switch[aria-checked="true"] { color: var(--text); }
.switch[aria-checked="true"] .track { background: color-mix(in srgb, var(--text) 24%, transparent); }
.switch[aria-checked="true"] .knob { transform: translateX(12px); background: var(--text); }
/* checkboxes: a 16px box from the ramp, off-white with a dark tick when on */
input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; display: inline-grid; place-content: center; width: 16px; height: 16px; margin: 0; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--text) 28%, transparent); background: var(--raised); cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease; }
input[type=checkbox]::after { content: ""; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg) scale(0); transition: transform 140ms var(--ease); }
input[type=checkbox]:hover { border-color: color-mix(in srgb, var(--text) 45%, transparent); }
input[type=checkbox]:checked { background: var(--text); border-color: var(--text); }
input[type=checkbox]:checked::after { transform: rotate(-45deg) scale(1); }
input[type=checkbox]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.check-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.seg button, .tab { height: var(--h-s); padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--dim); white-space: nowrap; transition: background-color var(--t-mid) ease, color var(--t-mid) ease; }
.seg button:active:not(:disabled), .tab:active { background: var(--hover); }
.seg button:hover, .tab:hover { color: var(--text); }
.seg button.on, .tab.on { background: var(--press); color: var(--text); }
.slide-host { position: relative; isolation: isolate; }
.slide-mark { position: absolute; left: 0; top: 0; z-index: -1; width: 0; height: 0; border-radius: 999px; background: var(--press); pointer-events: none; opacity: 0; }
.slide-mark.go { transition: transform var(--t-slow) var(--ease), width var(--t-slow) var(--ease), height var(--t-slow) var(--ease), opacity var(--t-fast) ease; }
.slide-host.marked > .on, .slide-host.marked > .on:hover { background: transparent; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--quiet); }
.dot.ok { background: var(--text); box-shadow: none; }
.dot.live { background: var(--text); box-shadow: none; animation: pulse 1.1s ease-in-out infinite; }
.dot.miss { background: var(--warn); box-shadow: none; }
.dot.bad { background: var(--bad); box-shadow: none; }
.tag { display: block; text-align: right; font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--faint); margin: 4px 4px 0 0; }
.tag .linkish { font: inherit; letter-spacing: inherit; margin-left: 8px; color: var(--dim); border-radius: 4px; }
.tag .linkish:hover { color: var(--text); }
/* "In plain words": the app's plain-English line of what an expert did, for a non-technical reader */
.plain-words { max-width: 70ch; margin: 8px 0 4px; padding: 12px 16px; border-radius: 0 var(--r-s) var(--r-s) 0; background: var(--hover); border-left: 2px solid var(--line-strong); }
.plain-words b { display: block; font: 400 12px/1.4 var(--mono); letter-spacing: 0.01em; color: var(--faint); margin-bottom: 4px; }
.plain-words p { margin: 0; color: var(--text); line-height: 1.5; }
/* a longer explanation, folded behind one word */
.moreinfo { margin: 4px 0 0; }
.moreinfo summary { display: inline-block; font-size: 13px; color: var(--dim); cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 3px; border-radius: 4px; }
.moreinfo summary::-webkit-details-marker { display: none; }
.moreinfo summary:hover { color: var(--text); }
.moreinfo[open] summary { color: var(--text); }
.moreinfo p { margin: 4px 0 0; font-size: 13px; color: var(--dim); line-height: 1.5; max-width: 70ch; }
/* one line that says something is missing, with the button that fixes it; nothing shows while it is empty */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; padding: 8px 12px; border-radius: var(--r-s); background: var(--hover); border: 1px solid var(--line); font-size: 13px; line-height: 1.45; color: var(--dim); }
.notice:empty { display: none; }
.notice > .nt { display: contents; }
/* lists of things to pick or read: the guide, allowed programs, saved chats */
.g-group { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--faint); margin: 24px 0 4px; }
.g-item { border-top: 1px solid var(--line); }
.g-item .g-row { border-top: 0; }
.g-item .moreinfo { margin: -4px 0 8px; }
.g-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; padding: 8px 0; border-top: 1px solid var(--line); }
.g-row b { font-weight: 500; font-size: 14px; }
.g-row small { grid-column: 1; color: var(--dim); font-size: 13px; line-height: 1.45; }
.g-row .go { grid-row: 1 / span 2; grid-column: 2; color: var(--faint); transition: color 140ms ease, transform 160ms var(--ease); }
button.g-row:hover .go { color: var(--text); transform: translate(1px, -1px); }
div.g-row { cursor: default; }
.g-row > .pill { grid-row: 1 / span 2; grid-column: 2; }
/* one thing that is connected or not: a dot, its name, one line */
.c-row { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
.c-row .dot { margin-top: 8px; }
.c-row b { display: block; font-weight: 500; font-size: 14px; }
.c-row small { display: block; color: var(--dim); font-size: 13px; line-height: 1.45; }
.c-row .act { margin: 8px 0 0; }
.c-row .notice { margin: 8px 0 0; }
.oc-row { padding-left: 24px; border-top: 0; }
.oc-row .act { grid-column: 1 / -1; margin: 8px 0 0; }
/* GitHub (Settings, Connections; Project details): the code to enter on GitHub, the account's picture */
.gh-code { margin: 8px 0 0; font-family: var(--mono); font-size: 20px; letter-spacing: 0.12em; color: var(--text); user-select: all; }
.c-row small.gh-note { margin-top: 4px; }
.gh-avatar { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px; margin-right: 6px; }
#pd-gh { margin: 0 0 16px; }
#pd-gh .act { margin: 8px 0 0; }
#pd-gh .check-row { margin: 4px 0 0; }

/* a press: the row's background deepens for as long as it is held */
.proj:active, .s-row:active, .cv-row:active, .cv-new:active, .opt:active:not(:disabled), .pk-ai:active, .xp-link:active, .bd-opt:active { background: var(--press); }

/* ---------- frame: the projects on the left, the chosen project's tabs on the right ---------- */
.app { height: 100%; display: grid; grid-template-columns: min(var(--side-w, 232px), 50vw) minmax(0, 1fr); }
/* the logo turns while anything works (the sidebar's mark, a new chat's sigil) */
@keyframes logo-turn { to { transform: rotate(360deg); } }
body.working .mark img, body.working .sigil { animation: logo-turn 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { body.working .mark img, body.working .sigil { animation: none; } }

.nav .tab .n.strong { font-weight: 700; color: var(--text); }

/* ---------- the Chat tab ---------- */
.body { display: grid; min-height: 0; min-width: 0; }
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
.chathead { display: flex; align-items: center; gap: 12px; padding: 4px 24px; min-height: 44px; border-bottom: 1px solid var(--line); }
.title { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 46ch; font-size: 14px; font-weight: 500; padding: 4px 8px; margin-left: -8px; border-radius: var(--r-s); text-align: left; }
.title span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title svg { flex: none; color: var(--faint); transition: transform 160ms var(--ease); }
.title:hover, .title[aria-expanded="true"] { background: var(--hover); }
.title[aria-expanded="true"] svg { transform: rotate(180deg); }
.conv { position: relative; min-width: 0; }
.cv-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border-radius: var(--r-s); transition: background-color var(--t-fast) ease; }
.cv-row:hover { background: var(--hover); }
.cv-row:focus-visible { outline-offset: -2px; }
.cv-row.on { background: var(--press); }
.cv-row b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-row small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-row .x { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); }
.cv-row .x:hover { background: var(--press); color: var(--text); }
.cv-row .x[data-sure] { width: auto; height: auto; min-height: 24px; max-width: 192px; padding: 4px 12px; border-radius: var(--r-m); background: var(--press); color: var(--text); font-size: 12px; line-height: 1.3; text-align: center; }
.cv-row.past { grid-template-columns: minmax(0, 1fr) auto; }
.cv-row.past .x, .cv-gone .x { width: auto; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; color: var(--dim); visibility: hidden; }
.cv-row.past:hover .x, .cv-row.past:focus-within .x, .cv-row.past .x[data-sure], .cv-gone .x { visibility: visible; }
.cv-gone { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 4px; }
.cv-gone summary { cursor: pointer; padding: 8px; font-size: 13px; color: var(--faint); list-style: none; border-radius: var(--r-s); }
.cv-gone summary::-webkit-details-marker { display: none; }
.cv-gone summary:hover { color: var(--text); }
.cv-new { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border-radius: var(--r-s); font-size: 14px; transition: background-color var(--t-fast) ease; }
.cv-new:hover { background: var(--hover); }
.cv-new:focus-visible { outline-offset: -2px; }
.cv-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 8px 4px; margin-top: 4px; border-top: 1px solid var(--line); }
.title-edit { width: min(46ch, 50vw); height: var(--h-m); padding: 0 8px; margin-left: -8px; border-radius: var(--r-s); border: 1px solid var(--focus); background: var(--raised); font-size: 14px; font-weight: 500; outline: none; }
.chathead .meta { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); white-space: nowrap; }
.chathead .meta .linkish { color: var(--text); }
/* the run's pause and play button (Head.tsx RunPlay): a 28px ghost control; the icon is two pieces of the text colour,
   each cut to shape (clip-path), which reshape between the two bars of pause and the two halves of play */
.run-play { position: relative; display: grid; place-items: center; width: var(--h-s); height: var(--h-s); border-radius: var(--r-s); color: var(--text); transition: background-color 140ms ease, transform 140ms var(--ease); }
.run-play:hover { background: var(--press); }
.run-play:active { transform: scale(0.92); }
.run-play.err { color: var(--bad-ink); }
.rp-ico { position: relative; display: block; width: 14px; height: 14px; }
.rp-ico i { position: absolute; inset: 0; background: currentColor; transition: clip-path 260ms var(--ease), -webkit-clip-path 260ms var(--ease); }
.rp-ico i:first-child { -webkit-clip-path: polygon(16% 8%, 40% 8%, 40% 92%, 16% 92%); clip-path: polygon(16% 8%, 40% 8%, 40% 92%, 16% 92%); }
.rp-ico i:last-child { -webkit-clip-path: polygon(60% 8%, 84% 8%, 84% 92%, 60% 92%); clip-path: polygon(60% 8%, 84% 8%, 84% 92%, 60% 92%); }
.run-play.going .rp-ico i:first-child { -webkit-clip-path: polygon(20% 6%, 56% 28%, 56% 72%, 20% 94%); clip-path: polygon(20% 6%, 56% 28%, 56% 72%, 20% 94%); }
.run-play.going .rp-ico i:last-child { -webkit-clip-path: polygon(55.5% 27.7%, 92% 50%, 92% 50%, 55.5% 72.3%); clip-path: polygon(55.5% 27.7%, 92% 50%, 92% 50%, 55.5% 72.3%); }
.scroll { overflow-y: auto; padding: 24px 24px 12px; min-height: 0; }
/* a long word (a path, an address, a command) breaks rather than making the conversation scroll sideways */
.col { max-width: 800px; margin: 0 auto; overflow-wrap: anywhere; }
.col[hidden] { display: none; }

/* conversation */
.prose, .you > div, .err, .ask pre, .modal pre, .step { -webkit-user-select: text; user-select: text; }
.you { display: flex; flex-direction: column; align-items: flex-end; margin: 24px 0 8px; }
/* the user's message: T3 Code's bubble, its own surface and text colour (messageSurface), round on every corner */
.you > div { max-width: 80%; padding: 10px 16px; border-radius: var(--r-l); white-space: pre-wrap; word-break: break-word; background: var(--msg-bg); color: var(--msg-ink); }
.you.queued > div { background: none; border-style: dashed; color: var(--dim); }
.you.queued .qmeta { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--faint); margin-top: 4px; }
.you.queued .qmeta button { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
.you .pics, .you .docs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 8px; background: none; border: 0; padding: 0; max-width: 100%; }
.you .pics img { height: 92px; max-width: 180px; object-fit: cover; border-radius: var(--r-s); border: 1px solid var(--line); cursor: zoom-in; display: block; }
.you .docs span.d { display: inline-flex; flex-direction: column; gap: 2px; max-width: 220px; padding: 8px 12px; border-radius: var(--r-s); border: 1px solid var(--line); }
.turn { margin: 16px 0 8px; }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--faint); margin-bottom: 8px; }
.steps { position: relative; margin: 4px 0 12px; padding-left: 16px; }
.steps::before { content: ""; position: absolute; left: 2.5px; top: 8px; bottom: 8px; width: 1px; background: var(--line-strong); }
.step { position: relative; font-size: 13px; color: var(--faint); padding: 2px 0; }
.step::before { content: ""; position: absolute; left: -16px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); border: 1px solid var(--quiet); }
.step.live { color: var(--text); }
.step.live::before { background: var(--text); border-color: var(--text); animation: pulse 1.1s ease-in-out infinite; }
.steps.done { margin: 0 0 8px; }
.steps.done .step, .steps.done::before { display: none; }
.steps.done.open .step { display: block; }
.steps.done.open::before { display: block; top: 28px; }
/* a finished turn's steps: one small, faint line to open them */
.fold { display: none; align-items: center; gap: 4px; font-size: 12px; color: var(--faint); margin-left: -16px; padding: 2px 8px 2px 0; border-radius: 4px; }
.fold:hover { color: var(--text); }
.steps.done .fold { display: inline-flex; }
.fold svg { transition: transform 180ms var(--ease); }
.steps.open .fold svg { transform: rotate(90deg); }
.shots { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.shot { border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); transition: border-color 160ms ease; }
.shot:hover { border-color: var(--line-strong); }
.shot img { display: block; height: 196px; max-width: 100%; background: var(--raised); }
.prose { position: relative; max-width: 70ch; }
.prose p { margin: 0 0 8px; }
.prose h3 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; }
.prose ul, .prose ol { margin: 0 0 8px; padding-left: 24px; }
.prose li { margin: 4px 0; }
.prose li::marker { color: var(--quiet); }
.prose strong { font-weight: 600; }
.prose code { font-family: var(--mono); font-size: 12px; padding: 1px 4px; border-radius: 4px; background: var(--hover); border: 1px solid var(--line); word-break: break-all; }
.prose pre { position: relative; margin: 0 0 12px; padding: 12px 16px; border-radius: var(--r-m); background: var(--code-bg); border: 1px solid var(--line); overflow-x: auto; }
.prose pre code { padding: 0; border: 0; background: none; line-height: 1.55; white-space: pre; word-break: normal; }
.prose table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.prose th { text-align: left; font-weight: 500; color: var(--dim); }
.prose th, .prose td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
/* "copy" is there only under the pointer or the keyboard */
.copy { position: absolute; top: -4px; right: -4px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; color: var(--dim); background: var(--raised); border: 1px solid var(--line-strong); opacity: 0; pointer-events: none; transition: opacity 140ms ease; -webkit-user-select: none; user-select: none; }
.prose:hover > .copy, .copy:focus-visible, .prose pre:hover > .copy { opacity: 1; pointer-events: auto; }
.prose pre > .copy { top: 8px; right: 8px; }
.err .pill { margin-left: 12px; vertical-align: baseline; }
/* what went wrong: a small box in the theme's error tint (T3 Code's errorSurface and errorForeground) */
.err { margin: 8px 0 12px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--bad) 28%, transparent); background: var(--bad-bg); color: var(--bad-ink); border-radius: var(--r-s); font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
/* a stopped or cut-short turn: a hairline across with the word in the middle (T3 Code's system divider) */
.sys-line { display: flex; align-items: center; gap: 8px; margin: 8px 0; padding: 8px 0; font-size: 12px; font-weight: 500; color: var(--faint); }
.sys-line::before, .sys-line::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--line-strong) 70%, transparent); }
.sys-line span { padding: 4px 8px; border-radius: 999px; }
/* two in a row (cut short, then stopped) say one thing: only the last shows */
.sys-line:has(+ .sys-line) { display: none; }
.ask { position: relative; margin: 8px 0 16px; padding: 16px; border-radius: var(--r-l); background: var(--panel); border: 1px solid var(--line-strong); max-width: 70ch; }
.ask h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.ask p { margin: 0 0 8px; color: var(--dim); font-size: 14px; line-height: 1.5; }
.ask pre { margin: 0 0 12px; padding: 8px 12px; border-radius: var(--r-s); background: var(--hover); border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 132px; overflow-y: auto; }
.ask .act { margin: 0; }
/* a button with a long list in it ("Allow cd, find, ... and carry on") wraps instead of running out of the card */
.ask .act .pill { max-width: 100%; height: auto; min-height: var(--h-m); padding: 4px 16px; border-radius: 16px; white-space: normal; text-align: left; }
.ask pre.whole { max-height: none; overflow: visible; word-break: break-all; }
.settings-note { position: fixed; top: 56px; right: 16px; z-index: 60; width: min(520px, calc(100vw - 32px)); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); margin: 0; max-height: calc(100vh - 72px); overflow-y: auto; }
.settings-note ul { margin: 0 0 12px; padding-left: 16px; color: var(--dim); font-size: 13px; line-height: 1.5; }
.ask .wait { font-size: 12px; color: var(--dim); margin: 8px 0 0; }
.ask .wait::after, .now::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
.ask.done { padding: 8px 16px; }
.ask.done h4 { margin: 0; font-weight: 500; color: var(--dim); font-size: 13px; }
.ask.done p, .ask.done pre, .ask.done .act, .ask.done .wait { display: none; }
.ask.promo.nogame h4::after { content: "no game"; margin-left: 8px; font: 400 12px/1 var(--mono); color: var(--faint); }
/* a finished promo: the video, its caption, and what to do with it */
.promo video { display: block; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; max-height: 70vh; margin: 2px 0 8px; border-radius: var(--r-m); background: #000; }
.promo .meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--faint); margin: 0 0 8px; }
.promo textarea { display: block; width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical; margin: 0 0 8px; padding: 8px 12px; border-radius: var(--r-s); background: var(--hover); border: 1px solid var(--line); color: var(--text); font: 13px/1.5 var(--sans); }
.promo textarea:focus { outline: none; border-color: var(--focus); }
.promo .saved { font-size: 12px; color: var(--dim); margin: 0 0 8px; min-height: 18px; }
.promo .check { font-size: 13px; color: var(--dim); margin: 0 0 12px; white-space: pre-line; }
.promo .check.bad { color: var(--text); border-left: 2px solid var(--dim); padding-left: 8px; }
.promo .act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.promo label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--dim); }
.undo-turn { display: inline-block; margin: 2px 0 8px; font-size: 12px; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; border-radius: 4px; }
.undo-turn:hover { color: var(--text); }
.undo-turn.said { text-decoration: none; cursor: default; }

/* An expert the chat started: one line where it was started (who, and what for), which opens the expert's own chat.
   The expert itself is listed under this chat in the sidebar. */
.xp-link { display: grid; grid-template-columns: 8px auto minmax(0, auto) auto; justify-content: start; align-items: center; gap: 8px; width: fit-content; max-width: min(70ch, 100%); min-height: var(--h-s); padding: 2px 8px; margin: 2px 0 2px -8px; text-align: left; border-radius: var(--r-s); font-size: 13px; transition: background-color var(--t-fast) ease; }
.xp-link:hover { background: var(--hover); }
.xp-link b { font-weight: 500; white-space: nowrap; }
.xp-link .xp-job { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xp-link .xp-go { font-size: 12px; color: var(--faint); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.xp-link:hover .xp-go, .xp-link:focus-visible .xp-go { color: var(--text); }
/* an expert's chat is its own log, read only: this line takes the message box's place */
.xp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; max-width: 800px; min-height: var(--h-l); margin: 0 auto; padding: 8px 16px; border-radius: var(--r-l); background: var(--panel); border: 1px solid var(--line-strong); font-size: 13px; color: var(--dim); }
.xp-bar > span { flex: 1; min-width: 16ch; }
.ai-tag { color: var(--dim); }

/* the first screen of a chat */
.hello { max-width: 640px; padding-top: 4vh; }
.hello h1 { font-size: 16px; line-height: 1.4; letter-spacing: -0.01em; font-weight: 600; margin: 12px 0 4px; }
.hello h1 span { color: var(--dim); }
.hello .lede { color: var(--dim); max-width: 52ch; margin: 0 0 16px; }
.sigil { display: block; width: 24px; height: 24px; }
:root[data-appearance="light"] .mark img, :root[data-appearance="light"] .sigil { filter: invert(1); }
.hello-needs:empty { display: none; }
.hello-needs { margin: 0 0 16px; }
.hello-needs .c-row { border-top: 0; padding: 4px 0; }
.start { max-width: 60ch; margin: 0 0 24px; }
.start .sub { margin: 8px 0 0; }
.start .where { word-break: break-all; }
.start .warn, .sub.warn { color: var(--text); }

/* the message box: the words on top; under them, what to add, which AI and model, how it works, and Send */
.dock { padding: 8px 24px 16px; }
.composer { --cm-line: var(--line-strong); position: relative; max-width: 800px; margin: 0 auto; border-radius: var(--r-l); background: var(--panel); border: 1px solid var(--cm-line); transition: border-color 160ms ease; }
.composer:focus-within { --cm-line: color-mix(in srgb, var(--text) 40%, transparent); }
.composer.drop { --cm-line: var(--focus); }
/* the message box wraps every line, so it never scrolls sideways (the Mac's web view drew a sideways bar under it) */
textarea#box { display: block; width: 100%; resize: none; overflow-x: hidden; overflow-wrap: anywhere; border: 0; outline: 0; background: none; line-height: 1.5; padding: 12px 16px 4px; max-height: 200px; min-height: 40px; }
textarea::placeholder, input::placeholder { color: var(--placeholder); opacity: 1; }
.c-bar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; min-width: 0; }
/* the controls under the words: after T3 Code's composer controls (MIT; see THIRD_PARTY.md). Each is a 28px ghost
   button with rounded corners: the label at 80% of the text colour, the icon muted, a soft fill on hover and while its
   menu is open. */
.c-add { flex: none; width: var(--h-s); height: var(--h-s); display: grid; place-items: center; color: var(--dim); border-radius: var(--r-s); transition: background-color 140ms ease, color 140ms ease, transform 140ms var(--ease); }
.c-add:hover, .c-add[aria-expanded="true"] { color: var(--text); background: var(--ctl-hover); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: var(--h-s); max-width: 260px; padding: 0 8px; border-radius: var(--r-s); font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--text) 80%, transparent); white-space: nowrap; transition: background-color 140ms ease, color 140ms ease, transform 140ms var(--ease); }
.chip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip:hover, .chip[aria-expanded="true"] { color: var(--text); background: var(--ctl-hover); }
.chip svg { flex: none; color: var(--dim); }
.chip svg.down { width: 14px; height: 14px; margin: 0 -2px 0 -2px; color: var(--faint); }
.chip:active:not([aria-haspopup]), .c-add:active:not([aria-haspopup]) { transform: scale(0.97); }
.chip .extra { font: 500 12px/1 var(--mono); color: var(--text); }
.chip .m-eff { flex: none; font-size: 12px; font-weight: 400; color: var(--dim); }
#now { flex: 1; min-width: 0; padding: 0 8px; text-align: right; font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#now .now, #now .sel { color: var(--dim); }
/* Send: T3 Code's round button, a touch bigger under the pointer, sunk while pressed, a quiet grey while there is
   nothing to send */
.send { flex: none; width: var(--h-m); height: var(--h-m); border-radius: 50%; display: grid; place-items: center; background: var(--main); color: var(--main-ink); box-shadow: 0 1px 2px 0 color-mix(in srgb, var(--main) 24%, transparent); transition: transform 150ms var(--ease), background-color 160ms ease, box-shadow 150ms ease, filter 150ms ease; }
.send:hover:not([disabled]) { transform: scale(1.05); filter: brightness(1.08); }
.send:active:not([disabled]) { transform: scale(0.97); box-shadow: none; }
.send[disabled] { background: color-mix(in srgb, var(--text) 12%, transparent); color: var(--dim); box-shadow: none; }
.send.stop { background: color-mix(in srgb, var(--text) 12%, transparent); color: var(--text); box-shadow: none; }
.send .i-stop, .send.stop .i-send { display: none; }
.send.stop .i-stop { display: block; }
.atts { display: none; flex-wrap: wrap; gap: 8px; padding: 12px 12px 0; }
.atts.has { display: flex; }
.att { position: relative; width: 64px; height: 64px; border-radius: var(--r-s); overflow: hidden; border: 1px solid var(--line-strong); background: var(--raised); }
.att img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att.wait img { opacity: 0.4; }
.att.doc { width: auto; max-width: 192px; min-width: 96px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 24px 0 12px; }
.att.doc.wait { opacity: 0.5; }
.att button { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(11, 11, 12, 0.85); opacity: 0; transition: opacity 140ms ease; }
.att:hover button, .att button:focus-visible { opacity: 1; }
.ext { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; text-transform: uppercase; color: var(--dim); }
.fname { font-size: 13px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aigap { max-width: 800px; margin: 8px auto 0; padding: 0 16px; font-size: 13px; color: var(--dim); }
.pick { position: relative; display: inline-flex; min-width: 0; }
/* a menu opens upwards from its button (downwards for the chat's name) */
/* a menu opens upwards from its button (downwards for the chat's name). After T3 Code's pop-ups (MIT; see
   THIRD_PARTY.md): 8px corners, 4px inside, a long soft shadow, and it grows in from 98% where its button is. */
.menu { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 20; width: 320px; max-height: min(480px, 72vh); overflow-y: auto; padding: 4px; border-radius: var(--r-s);
  background: var(--raised); border: 1px solid var(--line-strong); box-shadow: 0 18px 44px -18px rgb(0 0 0 / 0.8);
  opacity: 0; transform: scale(0.98); transform-origin: bottom left; pointer-events: none; visibility: hidden; transition: opacity 140ms ease, transform 160ms var(--ease), visibility 0s 160ms; }
:root[data-appearance="light"] .menu { box-shadow: 0 16px 40px -18px rgb(0 0 0 / 0.55); }
.menu.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity 140ms ease, transform 160ms var(--ease); }
.menu.down { top: calc(100% + 8px); bottom: auto; width: 340px; transform-origin: top left; }
.menu.down.on { transform: none; }
.menu h5 { margin: 0; padding: 6px 8px 4px; font: 500 12px/1.4 var(--sans, inherit); color: var(--dim); }
.menu h5.rule { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.menu .seg { margin: 2px 4px 4px; display: flex; padding: 2px; gap: 0; border: 0; border-radius: var(--r-s); background: color-mix(in srgb, var(--line-strong) 40%, transparent); }
.menu .seg button { flex: 1; height: 24px; padding: 0 4px; font-size: 12px; border-radius: 6px; }
.menu .seg button.on { background: color-mix(in srgb, var(--text) 14%, transparent); }
.menu .switch { display: flex; align-items: center; width: 100%; min-height: var(--h-s); padding: 4px 8px; border-radius: 4px; color: var(--text); }
.menu .switch:hover { background: color-mix(in srgb, var(--text) 9%, transparent); }
.menu .switch > span:last-child { flex: 1; min-width: 0; order: -1; }
.menu .switch .track { width: 30px; height: 18px; border: 0; background: var(--line-strong); }
.menu .switch .knob { top: 2px; left: 2px; width: 14px; height: 14px; background: var(--dim); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.18); }
.menu .switch[aria-checked="true"] .track { background: var(--accent); }
.menu .switch[aria-checked="true"] .knob { transform: translateX(12px); background: var(--bg); }
.menu .switch:focus-visible, .opt:focus-visible { outline-offset: -2px; }
.menu .switch small { display: block; font-size: 12px; color: var(--dim); line-height: 1.35; }
.menu .sub { margin: 4px 8px 8px; }
/* a row of a menu: the words first, the tick at the end (T3 Code's menu rows); a chosen choice keeps a faint fill */
.opt { display: grid; grid-template-columns: minmax(0, 1fr) 14px; gap: 8px; align-items: center; width: 100%; min-height: var(--h-s); text-align: left; padding: 4px 8px; border-radius: 4px; transition: background-color var(--t-fast) ease; }
.opt:hover { background: color-mix(in srgb, var(--text) 9%, transparent); }
.opt[role="radio"][aria-checked="true"], .opt[role="menuitemradio"][aria-checked="true"] { background: color-mix(in srgb, var(--text) 6%, transparent); }
.opt[role="radio"][aria-checked="true"]:hover, .opt[role="menuitemradio"][aria-checked="true"]:hover { background: color-mix(in srgb, var(--text) 9%, transparent); }
.opt:disabled { opacity: 0.64; }
.opt:disabled b { opacity: 1; }
.opt b { font-weight: 400; font-size: 14px; color: var(--text); }
.opt small { display: block; font-size: 12px; color: var(--dim); line-height: 1.35; }
.opt .tick { order: 2; display: grid; place-items: center; visibility: hidden; color: var(--text); }
.opt .tick svg { width: 12px; height: 12px; }
.opt[aria-selected="true"] .tick, .opt[aria-checked="true"] .tick { visibility: visible; }
#add-menu { width: 240px; }
#mode-menu { width: 320px; }
/* the one picker, after T3 Code's model picker (MIT; see THIRD_PARTY.md): the AIs as logos in a narrow rail, the
   chosen AI's models with a search over them, and effort in a column on the right. One height, so a short or long
   list never resizes it. */
.picker { width: min(556px, calc(100vw - min(var(--side-w, 232px), 50vw) - 64px)); height: min(346px, 72vh); padding: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr) 176px; overflow: hidden; }
.picker.own { width: min(380px, calc(100vw - min(var(--side-w, 232px), 50vw) - 64px)); grid-template-columns: 44px minmax(0, 1fr); }
.pk-ais { display: flex; flex-direction: column; gap: 4px; padding: 4px; overflow-y: auto; scrollbar-width: none; background: color-mix(in srgb, var(--muted-bg) 30%, transparent); }
.pk-ais::-webkit-scrollbar { display: none; }
.pk-ai { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; border-radius: 6px; transition: background-color 140ms ease; }
.pk-ai:hover, .pk-ai:focus-visible { background: color-mix(in srgb, var(--text) 10%, transparent); outline: 0; }
.pk-ai .ai-logo { opacity: 0.7; transition: opacity 140ms ease, transform 160ms var(--ease); }
.pk-ai:hover .ai-logo, .pk-ai[aria-checked="true"] .ai-logo { opacity: 1; }
.pk-ai:active .ai-logo { transform: scale(0.92); }
.pk-ai.missing .ai-logo { opacity: 0.35; }
.pk-ai::after { content: ""; position: absolute; right: -4px; top: 50%; width: 3px; height: 20px; margin-top: -10px; border-radius: 999px; background: var(--accent); transform: scaleY(0); transition: transform 200ms var(--ease); }
.pk-ai[aria-checked="true"]::after { transform: none; }
.pk-models { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--line); background: color-mix(in srgb, var(--muted-bg) 40%, transparent); }
.pk-models .notice { margin: 8px 8px 0; }
.pk-models .notice:empty { display: none; }
#model-menu { display: flex; flex-direction: column; flex: 1; min-height: 0; }
#model-menu .mfind { position: relative; display: block; flex: none; margin: 10px 12px 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); cursor: text; transition: border-color 140ms ease; }
#model-menu .mfind:focus-within { border-color: var(--focus); }
#model-menu .mfind svg { position: absolute; left: 0; top: 5px; color: var(--faint); pointer-events: none; }
#model-menu .mfind input { display: block; width: 100%; height: 26px; padding: 0 0 0 22px; font-size: 14px; background: transparent; border: 0; outline: 0; }
#model-menu .mfind input::-webkit-search-cancel-button { display: none; }
#model-menu .mlist { flex: 1; min-height: 0; padding: 6px 4px 6px 8px; overflow-y: auto; overscroll-behavior: contain; }
#model-menu .mgroup { margin: 0; padding: 6px 8px 4px; font-size: 12px; font-weight: 500; color: var(--dim); }
#model-menu .m-empty { margin: 0; padding: 8px; font-size: 13px; color: var(--dim); }
.pk-m { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--h-s); padding: 4px 8px; border-radius: 4px; text-align: left; transition: background-color var(--t-fast) ease; }
.pk-m:hover, .pk-m:focus-visible { background: color-mix(in srgb, var(--text) 9%, transparent); outline: 0; }
.pk-m:active { background: var(--press); }
.pk-m .ai-logo { flex: none; }
.pk-m-t { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.pk-m-t b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 400; color: var(--text); }
.pk-m-t small { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: color-mix(in srgb, var(--dim) 70%, transparent); }
.pk-m .tick { display: none; flex: none; color: var(--text); }
.pk-m .tick svg { width: 12px; height: 12px; display: block; }
.pk-m[aria-selected="true"] .tick { display: block; }
/* effort: a heading with the chosen level beside it, then one row a level, the tick on the chosen one */
.pk-effort { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: color-mix(in srgb, var(--muted-bg) 40%, transparent); }
.pk-effort[hidden] { display: none; }
.pk-eh { display: flex; align-items: center; gap: 8px; flex: none; height: 33px; margin: 10px 12px 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--dim); }
.pk-eh em { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: normal; font-size: 12px; }
.pk-er-list { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; padding: 10px 8px 6px; overflow-y: auto; }
.pk-er { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; flex: none; padding: 0 8px; border-radius: 4px; font-size: 14px; color: var(--text); text-align: left; transition: background-color var(--t-fast) ease; }
.pk-er:hover, .pk-er:focus-visible { background: color-mix(in srgb, var(--text) 9%, transparent); outline: 0; }
.pk-er:active { background: var(--press); }
.pk-er > span { flex: 1; min-width: 0; }
.pk-er .tick { visibility: hidden; color: var(--text); }
.pk-er .tick svg { width: 12px; height: 12px; display: block; }
.pk-er[aria-checked="true"] .tick { visibility: visible; }
.slash { position: absolute; left: 8px; bottom: calc(100% + 8px); z-index: 5; min-width: 320px; padding: 4px; border-radius: var(--r-l); background: var(--raised); border: 1px solid var(--line-strong); display: none; }
.slash.on { display: block; }
.slash button { display: grid; grid-template-columns: 84px 1fr; gap: 12px; width: 100%; text-align: left; padding: 8px 12px; border-radius: var(--r-s); font-size: 13px; transition: background-color var(--t-fast) ease; }
.slash button:hover, .slash button.sel { background: var(--hover); }
.slash code { font-family: var(--mono); font-size: 12px; }
.slash span { color: var(--dim); }
.slash .how { padding: 8px 12px 4px; font-size: 12px; color: var(--faint); }
/* a short word from the app, over the message box for a few seconds, and over any menu that is open there */
.saytip { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 25; max-width: 62ch; padding: 8px 12px; border-radius: var(--r-m); background: var(--raised); border: 1px solid var(--line-strong); font-size: 13px; line-height: 1.45; opacity: 0; transform: translateY(4px); pointer-events: none; visibility: hidden; transition: opacity 160ms ease, transform 200ms var(--ease), visibility 0s 200ms; }
.saytip.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity 160ms ease, transform 200ms var(--ease); }
.saytip .linkish { margin-left: 8px; }
.saytip.free { left: 24px; bottom: 24px; box-shadow: var(--shadow-pop); }

/* ---------- the team board: beside a Lead's chat while its team works at the same time ----------
   One ordered log of what the members say to each other, the Lead and the user. Each member keeps one soft colour
   (its name, its mentions, its chip), so a busy board reads at a glance; everything else stays in the greyscale.
   Collapsed it is a slim rail; in a narrow space it lies over the chat and folds to one small pill. */
.body { position: relative; }
.body.with-board { grid-template-columns: minmax(0, 1fr) auto; }
.board { display: flex; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); }
.bd-panel { width: 340px; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; }
.board.shut .bd-panel, .board:not(.shut) .bd-rail { display: none; }
.bd-rail { position: relative; width: 44px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; color: var(--dim); transition: background-color 140ms ease, color 140ms ease; }
.bd-rail:hover { background: var(--hover); color: var(--text); }
.bd-rail:focus-visible { outline-offset: -2px; }
.bd-rail-t { writing-mode: vertical-rl; font-size: 12px; letter-spacing: 0.02em; }
.bd-unread { min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; font: 600 12px/1 var(--mono); background: var(--text); color: var(--ink); }
.bd-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 8px; min-height: 44px; padding: 4px 8px 4px 16px; border-bottom: 1px solid var(--line); }
.bd-head b { font-size: 14px; font-weight: 600; }
.bd-head small { grid-column: 1; display: block; font-size: 12px; color: var(--faint); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd-head small .linkish { font-size: 12px; color: var(--dim); }
.bd-head small .linkish:hover { color: var(--text); }
.bd-head .icon { grid-column: 2; grid-row: 1 / span 2; }
/* the roster: one chip per member, which shows only what it said and what was said to it */
.bd-tools { display: grid; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.bd-who { display: flex; flex-wrap: wrap; gap: 4px; }
.bd-who:empty { display: none; }
.bd-m { display: inline-flex; align-items: center; gap: 6px; height: 24px; max-width: 100%; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); font: 12px/1 var(--mono); color: var(--c, var(--text)); transition: background-color 140ms ease, border-color 140ms ease; }
.bd-m > span:not(.dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-m:hover { background: var(--hover); }
.bd-m[aria-pressed="true"] { background: var(--press); border-color: color-mix(in srgb, var(--c, var(--text)) 55%, transparent); }
.bd-m .dot { width: 6px; height: 6px; }
.bd-m.dim { opacity: 0.6; }
.bd-turn { font: 500 12px/1 var(--sans); font-style: normal; color: var(--text); padding: 2px 6px; margin-right: -4px; border-radius: 999px; background: var(--press); }
.bd-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.bd-filter .seg button .n { margin-left: 6px; font: 500 12px/1 var(--mono); color: var(--text); }
.bd-only { font-size: 12px; color: var(--dim); white-space: nowrap; }
.bd-only b { font: 500 12px var(--mono); color: var(--c, var(--text)); }
.bd-only .linkish { font-size: 12px; margin-left: 4px; }
/* the log: who, to whom, when; a short run of lines from one member reads as one block */
.bd-log { overflow-y: auto; min-height: 0; padding: 8px 8px 16px; -webkit-user-select: text; user-select: text; overscroll-behavior: contain; }
.bd-l { padding: 6px 8px; border-radius: var(--r-s); }
.bd-l:not(.cont) { margin-top: 6px; }
.bd-l.cont { padding-top: 0; }
.bd-l.cont .bd-meta { display: none; }
.bd-meta { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: 12px; color: var(--faint); line-height: 1.6; }
.bd-from { flex: none; font: 500 12px var(--mono); color: var(--c, var(--text)); }
.bd-to { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-meta time { margin-left: auto; flex: none; font: 12px var(--mono); color: var(--faint); }
.bd-k { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line-strong); font: 12px/1 var(--mono); color: var(--dim); }
.bd-k:empty { display: none; }
.bd-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.bd-at { font-weight: 500; color: var(--c, var(--text)); }
.bd-at.me { color: var(--text); background: var(--press); border-radius: 4px; padding: 0 3px; }
.bd-l.tome { background: var(--hover); box-shadow: inset 2px 0 0 var(--text); }
.bd-l.mine .bd-text { color: var(--dim); }
.k-done .bd-k, .k-merged .bd-k { color: var(--text); }
.k-merged .bd-k { background: var(--press); }
.k-verify .bd-k { border-style: dashed; }
.k-failed .bd-k { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.bd-l.k-failed { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--bad) 70%, transparent); }
.bd-l.k-system { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; padding: 0 4px; font: 12px/1.5 var(--mono); color: var(--faint); text-align: center; }
.bd-l.k-system::before, .bd-l.k-system::after { content: ""; flex: 1; min-width: 16px; height: 1px; background: var(--line); }
.bd-l.k-system span { max-width: 85%; }
.bd-empty { margin: 16px 8px; font-size: 13px; color: var(--faint); line-height: 1.5; }
/* the box to post in, with @-names offered as you type */
.bd-post { position: relative; padding: 8px 12px 12px; border-top: 1px solid var(--line); }
.bd-box { display: flex; align-items: flex-end; gap: 8px; padding: 4px 4px 4px 12px; border-radius: var(--r-l); background: var(--bg); border: 1px solid var(--line-strong); transition: border-color 160ms ease; }
.bd-box:focus-within { border-color: color-mix(in srgb, var(--text) 40%, transparent); }
.bd-box textarea { flex: 1; min-width: 0; resize: none; overflow-x: hidden; overflow-wrap: anywhere; border: 0; outline: 0; background: none; padding: 4px 0; min-height: var(--h-m); max-height: 120px; font-size: 13px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
.bd-box .send { width: var(--h-s); height: var(--h-s); }
.bd-hint { margin: 6px 4px 0; font-size: 12px; color: var(--faint); line-height: 1.4; }
.bd-hint.bad { color: var(--text); }
.bd-ac { position: absolute; left: 12px; right: 12px; bottom: calc(100% - 4px); z-index: 5; max-height: 240px; overflow-y: auto; padding: 4px; border-radius: var(--r-l); background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop); display: none; }
.bd-ac.on { display: block; }
.bd-opt { display: grid; grid-template-columns: 8px auto minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: var(--r-s); text-align: left; }
.bd-opt:hover, .bd-opt.sel { background: var(--hover); }
.bd-opt b { font: 500 13px var(--mono); color: var(--c, var(--text)); }
.bd-opt small { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd-opt .dot { width: 6px; height: 6px; }
/* a narrow space: the board still sits beside the chat (never over it, the user, 2026-11-24), only slimmer, and it
   starts folded to its rail */
.board.narrow .bd-panel { width: clamp(240px, 42vw, 300px); }
/* opening: the panel slides in from the right edge */
@keyframes bd-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.board:not(.shut) .bd-panel { animation: bd-in 280ms cubic-bezier(0.32, 0.72, 0, 1); }
@media (prefers-reduced-motion: reduce) { .board:not(.shut) .bd-panel { animation: none; } }
/* a member's state, as a dot: being checked is a ring, parked is quieter still */
.dot.verify { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text), 0 0 0 2.5px color-mix(in srgb, var(--text) 12%, transparent); }
.dot.park { opacity: 0.6; }

/* ---------- the other pages take the whole space under the project's bar ---------- */
#review, #promos, #newproj, #allproj { display: none; min-height: 0; overflow-y: auto; padding: 24px 24px 48px; }
body.review #review, body.promos #promos, body.newproj #newproj, body.all #allproj { display: block; }
body.review .body, body.promos .body, body.newproj .body, body.all .body { display: none; }
.r-col { max-width: 960px; margin: 0 auto; }
.r-col h2 { font-size: 16px; font-weight: 600; margin: 32px 0 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.r-col h2:first-child { margin-top: 0; }
.r-col h2 small { font-size: 12px; font-weight: 400; color: var(--faint); }
.r-sel { height: var(--h-m); padding: 0 8px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--panel); font-size: 13px; outline: none; max-width: 200px; }
.r-sel:focus-visible { border-color: var(--focus); }
.r-sel option { background: var(--raised); color: var(--text); }
.xp-tr { display: grid; grid-template-columns: minmax(0, 1fr) 168px 168px; gap: 2px 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.xp-tr b { font-weight: 500; font-size: 14px; }
.xp-tr .xp-filter { grid-column: 3; }
.xp-tr small { grid-column: 1 / -1; color: var(--dim); font-size: 13px; line-height: 1.45; }
.xp-tr .r-sel { max-width: 168px; width: 100%; }
@media (max-width: 700px) { .xp-tr { grid-template-columns: 1fr 1fr; } .xp-tr b { grid-column: 1 / -1; } .xp-tr .xp-filter { grid-column: 2; } .xp-tr .r-sel { max-width: none; } }
.r-note { font-size: 13px; color: var(--dim); margin: 8px 0 0; min-height: 1.4em; }
.r-note:empty { min-height: 0; margin: 0; }
.r-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* new project: Game or Project, a name and Create */
.np-make { display: grid; gap: 4px; padding: 16px; border-radius: var(--r-l); background: var(--panel); border: 1px solid var(--line-strong); max-width: 640px; }
.np-make .keyrow { margin: 0; }
.np-kind { margin: 0 0 8px; align-self: start; justify-self: start; }
.np-kind button { height: 32px; padding: 0 16px; font-size: 14px; }
.np-make .kind-note { margin: 0 0 8px; }
.np-make .keyrow input { height: var(--h-l); font-size: 15px; border-radius: var(--r-m); padding: 0 16px; }
.np-make .keyrow .pill { height: var(--h-l); padding: 0 24px; }
.np-make .act { margin: 8px 0 0; }
.np-make .where { word-break: break-all; }
.np-other { font-size: 13px; color: var(--dim); margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }

/* promos: the new-promo form on the left, the library on the right */
.eng-row .eng-error { font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--dim); white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; }
.eng-row .eng-error:empty { display: none; }
.eng-row.compact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; padding: 8px 8px 8px 16px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--panel); }
.eng-row.compact .sub { margin: 0; flex: 1; min-width: 200px; }
.eng-row.compact .act { margin: 0; }
.eng-row.compact .eng-bar, .eng-row.compact .eng-error { flex-basis: 100%; margin: 0; }
.eng-row.compact .act:has(.eng-install[hidden]) { display: none; }
.eng-row.compact.ready { display: none; }
.pr-form { display: grid; gap: 16px; margin-top: 12px; padding: 16px; border-radius: var(--r-l); background: var(--panel); border: 1px solid var(--line-strong); transition: border-color 140ms ease; }
.pr-form.drop { border-color: var(--focus); }
/* until the engine is installed the form can be read but not used */
.pr-form.off .pr-field, .pr-form.off .pr-more > div { pointer-events: none; }
.pr-form.off .pill, .pr-form.off .pr-style, .pr-form.off .pr-text, .pr-form.off .seg, .pr-form.off .r-sel, .pr-form.off input { opacity: 0.5; }
.pr-label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 8px; }
.pr-label small { font-weight: 400; color: var(--faint); margin-left: 8px; }
.pr-field .act { margin: 0; }
.pr-field .sub { margin: 8px 0 0; font-size: 13px; }
.pr-field .act .sub { margin: 0; }
.pr-files { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.pr-files:empty { display: none; }
.pr-file { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; height: var(--h-s); padding: 0 4px 0 12px; border-radius: 999px; background: var(--hover); border: 1px solid var(--line); font-size: 12px; }
.pr-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-file button { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); }
.pr-file button:hover { background: var(--press); color: var(--text); }
.pr-styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.pr-style { display: flex; flex-direction: column; text-align: left; padding: 4px; min-width: 0; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--raised); transition: border-color 140ms ease, background-color 140ms ease; }
.pr-style:hover { border-color: var(--line-strong); }
.pr-style[aria-pressed="true"] { border-color: var(--text); background: var(--press); }
.pr-style .still { display: grid; place-items: center; width: 100%; aspect-ratio: 9 / 16; border-radius: var(--r-s); background: #000; object-fit: cover; color: var(--faint); font-size: 12px; text-align: center; padding: 0 8px; box-sizing: border-box; }
.pr-style b { font-size: 13px; font-weight: 600; margin: 8px 4px 0; }
.pr-style small { font-size: 12px; color: var(--dim); line-height: 1.35; margin: 2px 4px 4px; }
.pr-text { display: block; width: 100%; box-sizing: border-box; resize: vertical; padding: 8px 12px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--raised); font: 14px/1.5 var(--sans); color: var(--text); outline: none; -webkit-user-select: text; user-select: text; }
.pr-text:focus { border-color: var(--focus); }
.pr-more > summary { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); cursor: pointer; list-style: none; border-radius: 4px; }
.pr-more > summary::-webkit-details-marker { display: none; }
.pr-more > summary:hover { color: var(--text); }
.pr-more > summary svg { transition: transform 180ms var(--ease); }
.pr-more[open] > summary svg { transform: rotate(90deg); }
.pr-more > div { display: grid; gap: 16px; margin-top: 16px; }
.pr-go { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pr-go .r-note { margin: 0; }
.pr-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.pr-row b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-row small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
.pr-day { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--dim); margin: 24px 0 8px; }
.pr-day:first-child { margin-top: 12px; }
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 12px; align-items: start; }
.pr-grid .promo { margin: 0; max-width: none; }
.promo.flash { outline: 2px solid var(--text); outline-offset: 2px; }
/* two columns from 1000px: the form at a fixed width on the left, the library filling the rest, each scrolling on
   its own; below that, one column: the form, then the library */
.pr-page { max-width: 1600px; }
.pr-make { max-width: 600px; }
.pr-lib h2 { margin-top: 32px; }
@media (min-width: 1000px) {
  #promos { overflow: hidden; padding: 0; }
  #promos .pr-page { height: 100%; }
  .pr-cols { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 32px; height: 100%; min-height: 0; padding: 0 12px 0 24px; }
  .pr-make, .pr-lib { min-height: 0; overflow-y: auto; padding: 24px 12px 48px 0; }
  .pr-make { max-width: none; }
  .pr-lib h2 { margin-top: 0; }
}
.promo-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 8px 0 16px; font-size: 14px; }
.promo-line span { color: var(--dim); }

/* the run's own controls, behind one button at the top of a chat of its project */
.run-ctl { position: relative; display: inline-flex; }
.run-ctl[hidden] { display: none; }
.menu.run-menu { left: auto; right: 0; width: 344px; padding: 16px; }
.run-menu .pr-label { display: block; margin: 16px 0 8px; font-size: 12px; font-weight: 400; color: var(--dim); }
.run-menu .act { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.run-menu .ask { margin: 12px 0 0; padding: 12px; border-radius: var(--r-s); }
.rv-err, .rv-item .rv-err { margin: 8px 0 0; font-size: 14px; color: var(--text); }
.rv-err:empty { display: none; }
.rv-item .meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.01em; color: var(--faint); margin: 0 0 4px; }
.rv-gates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; font-size: 14px; color: var(--dim); }
.cp-list { display: grid; gap: 4px; margin: 0 0 12px; }
.cp-list button { height: var(--h-m); padding: 0 12px; text-align: left; border-radius: var(--r-s); border: 1px solid var(--line); font-size: 13px; color: var(--dim); transition: background-color 140ms ease, color 140ms ease; }

}
function bdPick(i) {

{

/* Text size: the whole window scales, so everything stays in proportion. Remembered on this computer. In the app the

   width, so at 150% two columns stayed side by side in room for one. A browser (the remote page) keeps CSS zoom. */
let scale = 100;
try { scale = Math.max(70, Math.min(200, parseInt(localStorage.getItem("scale") || "100", 10) || 100)); } catch (e) {}
function setScale(v) {
  scale = Math.max(70, Math.min(200, Math.round(v / 5) * 5));

  else document.documentElement.style.zoom = scale / 100;

function boot() {

async function poll() {
